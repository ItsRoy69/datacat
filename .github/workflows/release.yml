name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: agent/manifest.yaml
      - name: Build agent releases
        run: DESTDIR="$RUNNER_TEMP/downloads" bash agent/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: ${{ runner.temp }}/downloads/*
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Package Node library
        run: |
          mkdir -p dist/downloads
          cd sdks/node
          npm pack --pack-destination ../../dist/downloads
      - name: Package Python library
        run: |
          python -m pip install build
          python -m build sdks/python --outdir dist/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: libraries
          path: dist/downloads/*
  publish:
    needs: [agent, libraries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Include license files
        run: cp src/LICENSE src/NOTICE src/THIRD_PARTY_LICENSES.md downloads/
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "downloads/*"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" downloads/* --generate-notes
